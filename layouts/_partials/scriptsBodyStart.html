{{ range $mode, $file := dict "auto" "sun-moon.svg" "light" "sun.svg" "dark" "moon.svg" }}
  {{ with resources.Get (printf "icons/theme/%s" $file) }}
    <template id="theme-icon-{{ $mode }}">{{ .Content | safeHTML }}</template>
  {{ end }}
{{ end }}
{{ $script := resources.Get "js/theme.js" | minify | fingerprint }}
<script src="{{ $script.RelPermalink }}" integrity="{{ $script.Data.Integrity }}"></script>
