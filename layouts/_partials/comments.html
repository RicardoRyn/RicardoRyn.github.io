<div class="giscus"
     data-repo="RicardoRyn/RicardoRyn.github.io"
     data-repo-id="R_kgDOV3Ln4g"
     data-category="Announcements"
     data-category-id="DIC_kwDOV3Ln4s4DLx-e"
     data-mapping="pathname"
     data-strict="0"
     data-reactions-enabled="1"
     data-emit-metadata="0"
     data-input-position="bottom"
     data-lang="zh-CN"></div>
<script>
    (() => {
        const host = document.currentScript.previousElementSibling;
        const root = document.documentElement;
        const system = matchMedia("(prefers-color-scheme: dark)");
        const origin = "https://giscus.app";
        const theme = () => root.classList.contains("dark") ||
            (!root.classList.contains("light") && system.matches)
            ? "catppuccin_mocha" : "catppuccin_latte";
        const sync = () => {
            host.querySelector("iframe.giscus-frame")?.contentWindow?.postMessage(
                { giscus: { setConfig: { theme: theme() } } }, origin);
        };

        // Sync again after loading in case the theme changed while the iframe was loading.
        host.addEventListener("load", sync, true);
        new MutationObserver(sync).observe(root, { attributeFilter: ["class"] });
        system.addEventListener("change", sync);

        const client = document.createElement("script");
        Object.assign(client.dataset, host.dataset, { theme: theme() });
        client.src = `${origin}/client.js`;
        client.crossOrigin = "anonymous";
        host.after(client);
    })();
</script>
